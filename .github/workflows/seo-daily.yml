name: SEO daily builder

# Every morning, build the oldest approved suggestion (guide or tool) into a PR,
# fully autonomously, through the centrally-served DispatchSEO pipeline (get_instructions -> template -> live
# SERP gate -> humanizer -> PR). If nothing is approved, it exits cleanly. Skips
# if an SEO PR is already open, so there is never more than one at a time - the
# steady state is build -> auto-merge -> gone -> repeat, and if a PR gets stuck
# (failed check, or a tool PR awaiting you) the builder pauses instead of piling
# more on top. Publishing is handled by seo-auto-merge.yml: guide PRs whose
# checks all pass are merged hands-off; tool PRs are left for you to merge.
#
# WOKEN BY THE BACKEND, not by a cron chain. The dashboard decides when a build
# is due and fires the seo-guide-build repository_dispatch (see
# api/cron/seo-dispatch) - it already knows whether anything is approved,
# whether a PR is still open, and whether today's guide is built, so it can
# answer all of that without starting a runner.
#
# This used to run three times a day (05:13, 12:13, 19:13 UTC): once to work,
# twice as insurance against GitHub's scheduler dropping a trigger and against
# a Claude usage-limit deferral. GitHub bills a full minute minimum for every
# job that claims a runner, so those two extra attempts cost real money on your
# account to re-discover, in the guard step below, something the dashboard
# already knew. The backend retries instead - its own scheduler ticks every few
# hours, and a deferred run simply stays due.
#
# The single cron below is a DEAD-MAN'S SWITCH, not the schedule. It covers the
# one case the backend cannot report on: the backend itself being down or
# unable to reach this repo, which would otherwise stop every dispatch with
# nothing left running to notice. It fires LATE in the day on purpose - by
# 19:13 a healthy backend has long since dispatched, so the guard below finds
# today's guide already built and exits in seconds.
#
# Daily rather than weekly, deliberately. A weekly switch is cheaper (~8 billed
# minutes a month against ~60) but it lets a dead backend cost up to six days
# of publishing on a product whose whole promise is a guide a day. One day is
# an acceptable worst case; six is not. Offset off the top of the hour: GitHub
# queues/drops on-the-hour triggers more than odd minutes.

on:
  repository_dispatch:
    types: [seo-guide-build]
  schedule:
    - cron: "13 19 * * *" # 19:13 UTC - dead-man's switch only, see above
  workflow_dispatch:

concurrency:
  group: seo-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # The agent commits below. Pin an identity that maps to a real GitHub
      # account - Vercel refuses to deploy commits from unknown author emails,
      # and an unconfigured runner leaves the agent to improvise one.
      - name: Pin git identity to github-actions[bot]
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Skip if an SEO PR is already open or guide builds are toggled off
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEO_MCP_API_KEY: ${{ secrets.SEO_MCP_API_KEY }}
        run: |
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --label seo --state open --json number --jq 'length')
          if [ "$open" != "0" ]; then
            echo "An SEO PR is already open - skipping this run so only one is ever open at a time."
          fi
          # Automation-flag gate: the DispatchSEO dashboard can pause guide
          # builds (auto_build_guides off). 404 = backend without the endpoint
          # yet -> build as before; other failures are loud.
          if [ "$open" = "0" ]; then
            code=$(curl -s -o /tmp/mode.json -w "%{http_code}" --max-time 30 \
              -H "Authorization: Bearer $SEO_MCP_API_KEY" \
              https://dispatchseo.com/api/project-mode) || code=unreachable
            if [ "$code" = "200" ] && [ "$(jq -r '.automations.auto_build_guides' /tmp/mode.json)" = "false" ]; then
              echo "Guide builds are toggled off on the dashboard - skipping."
              open=paused
            elif [ "$code" = "unreachable" ] || [ "$code" = "000" ] || [ "$code" = "502" ] || [ "$code" = "503" ] || [ "$code" = "504" ]; then
              # Self-hosted backends reboot (kernel updates, docker restarts).
              # Unreachable is a delay, not a failure - the backend re-dispatches
              # on its next tick (the job stays due until something reports a
              # real outcome), and the in-stack builder covers this window too.
              echo "Backend unreachable right now (rebooting?) - deferring; it will re-dispatch when it is back."
              open=defer
            elif [ "$code" != "200" ] && [ "$code" != "404" ]; then
              echo "::error::project-mode endpoint returned HTTP $code"; exit 1
            fi
          fi
          # Already-built-today gate. The backend also checks cadence before it
          # dispatches, so this is the second of two gates, not the only one -
          # it still matters because workflow_dispatch, the daily dead-man's
          # cron, and a re-dispatch after an unreported run can all arrive on a
          # day that already has its guide.
          # Best-effort: missing field, non-200, or a parse failure all read
          # as "not built yet" so this check can never itself block a build.
          if [ "$open" = "0" ]; then
            code=$(curl -s -o /tmp/mode.json -w "%{http_code}" --max-time 30 \
              -H "Authorization: Bearer $SEO_MCP_API_KEY" \
              https://dispatchseo.com/api/project-mode) || code=unreachable
            if [ "$code" = "200" ] && [ "$(jq -r '.built_today.guide // false' /tmp/mode.json 2>/dev/null)" = "true" ]; then
              echo "Today's guide is already built - skipping this attempt."
              open=skip
            fi
          fi
          # Empty-queue gate, and it belongs HERE rather than inside the agent
          # run. The backend never dispatches with an empty queue, so on the
          # normal path this is already known - but the dead-man's cron below
          # has no such knowledge, and without this it would start a full
          # coding-agent session every day on a project with nothing approved,
          # just to have the agent exit cleanly. That is the expensive shape of
          # the no-op this whole design removes.
          # Absent field (older backend) or any non-200 reads as "work is
          # waiting", so this can only ever cost a run, never suppress one.
          if [ "$open" = "0" ] && [ "$code" = "200" ]; then
            if [ "$(jq -r '.approved_waiting.guide // true' /tmp/mode.json 2>/dev/null)" = "false" ]; then
              echo "No approved guide suggestions are waiting - nothing to build."
              open=skip
            fi
          fi
          echo "open=$open" >> "$GITHUB_OUTPUT"

      # Which coding agent builds this project - resolved at RUN time from the
      # dashboard, never baked in at install time.
      #
      # Same rule as the pnpm pin below, for the same reason: a decision left to
      # whoever ran the install is a decision someone eventually forgets, and the
      # failure mode here is a builder that runs the wrong agent every night.
      # Asking the backend means switching agent on the dashboard takes effect on
      # the next scheduled run with nothing to edit in this repo.
      #
      # The fallback matters as much as the happy path: a repo installed against
      # a backend that predates the `agent` field gets no value here, and must
      # keep behaving exactly as it did - which is Claude, because Claude was the
      # only option that ever existed before the field.
      - name: Resolve the coding agent
        id: agent
        if: steps.guard.outputs.open == '0'
        env:
          SEO_MCP_API_KEY: ${{ secrets.SEO_MCP_API_KEY }}
          CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          agent=""
          code=$(curl -s -o /tmp/agent.json -w "%{http_code}" --max-time 30 \
            -H "Authorization: Bearer $SEO_MCP_API_KEY" \
            https://dispatchseo.com/api/project-mode) || code=unreachable
          [ "$code" = "200" ] && agent=$(jq -r '.agent // empty' /tmp/agent.json 2>/dev/null)
          if [ -z "$agent" ] || [ "$agent" = "null" ]; then
            # No answer from the backend. Infer from which secret exists, and
            # tie-break to claude - see the note above.
            if [ -n "$OPENAI_API_KEY" ] && [ -z "$CLAUDE_TOKEN" ]; then agent=codex; else agent=claude; fi
            echo "Backend did not name an agent (HTTP $code) - inferred '$agent' from the secrets on this repo."
          fi
          # Fail here, in plain language, rather than letting the agent's own
          # action die minutes in on a cryptic validation error. The 2026-07-17
          # dogfood install burned four runs on exactly that.
          case "$agent" in
            claude)
              if [ -z "$CLAUDE_TOKEN" ]; then
                echo "::error::This project builds with Claude Code, but the CLAUDE_CODE_OAUTH_TOKEN secret is missing or empty on this repo. Rerun the setup command from your DispatchSEO dashboard (it mints and VERIFIES a fresh token), or set one by hand: run 'claude setup-token', then pipe the token into 'gh secret set CLAUDE_CODE_OAUTH_TOKEN' without any whitespace."
                exit 1
              fi
              case "$CLAUDE_TOKEN" in
                sk-ant-oat*) : ;;
                *)
                  echo "::error::CLAUDE_CODE_OAUTH_TOKEN does not look like a Claude Code OAuth token (expected it to start with sk-ant-oat). It was probably line-wrapped or the wrong text was pasted when it was saved. Rerun the setup command from your DispatchSEO dashboard to mint and verify a replacement."
                  exit 1 ;;
              esac ;;
            codex)
              if [ -z "$OPENAI_API_KEY" ]; then
                echo "::error::This project builds with Codex, but the OPENAI_API_KEY secret is missing or empty on this repo. Add it with 'gh secret set OPENAI_API_KEY', or rerun the setup command from your DispatchSEO dashboard."
                exit 1
              fi
              case "$OPENAI_API_KEY" in
                sk-*) : ;;
                *)
                  echo "::error::OPENAI_API_KEY does not look like an OpenAI key (expected it to start with sk-). It was probably line-wrapped or the wrong text was pasted when it was saved. Create a fresh key at platform.openai.com/api-keys and set it again."
                  exit 1 ;;
              esac ;;
            *)
              echo "::error::The dashboard reported an unknown agent '$agent'. This repo's workflows are older than that setting - re-run the setup command from your DispatchSEO dashboard to update them."
              exit 1 ;;
          esac
          echo "agent=$agent" >> "$GITHUB_OUTPUT"
          echo "Building with: $agent"

      # Fail loudly if the seo-manager MCP is unreachable. Without this, a
      # stale URL in mcp-ci.json makes Claude see an empty toolset and "exit
      # cleanly" - a green run that built nothing (2026-07-14 domain-move bug).
      - name: Preflight - seo-manager MCP reachable
        if: steps.guard.outputs.open == '0'
        env:
          SEO_MCP_API_KEY: ${{ secrets.SEO_MCP_API_KEY }}
        run: |
          url=$(node -e "console.log(require('./.github/mcp-ci.json').mcpServers['seo-manager'].url)")
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 -X POST "$url" \
            -H "Authorization: Bearer $SEO_MCP_API_KEY" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -d '{"jsonrpc":"2.0","id":0,"method":"tools/list"}')
          if [ "$code" != "200" ]; then
            echo "::error::seo-manager MCP at $url returned HTTP $code - fix the URL in .github/mcp-ci.json or the SEO_MCP_API_KEY secret"
            exit 1
          fi
          echo "seo-manager MCP OK ($url)"

      # Deliberately NOT an INSTALL-ADAPT step any more. This used to say "if
      # this repo has a packageManager field, DELETE the version input below" -
      # a conditional edit left to whoever ran the install, with a fatal
      # failure mode when it was missed: pnpm/action-setup hard-errors if a
      # version input sits alongside a packageManager pin, so the builder died
      # right here on every run, 13 seconds in, BEFORE reaching the step that
      # reports failures to the dashboard. It shipped that way and broke every
      # installed repo carrying a pin (2026-07-30). The two cases are now two
      # mutually-exclusive steps resolved at RUN time: there is nothing to
      # adapt, so there is nothing to forget. Do not reintroduce a `version:`
      # input on an unconditional step - scripts/pipeline-pack-lint.mjs fails
      # the build if the fatal shape comes back.
      - name: Read this repo's pnpm pin
        id: pnpm_pin
        if: steps.guard.outputs.open == '0'
        run: |
          pinned=0
          if [ -f package.json ] && node -e 'process.exit(require("./package.json").packageManager ? 0 : 1)' 2>/dev/null; then
            pinned=1
          fi
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          echo "packageManager pin in package.json: $pinned"

      # Pinned -> action-setup reads the exact version out of the field.
      # Passing a version input as well is precisely what hard-errors.
      - name: Set up pnpm (version from the repo's packageManager pin)
        if: steps.guard.outputs.open == '0' && steps.pnpm_pin.outputs.pinned == '1'
        uses: pnpm/action-setup@v4

      # No pin -> action-setup has to be told. pnpm 11 matches the Node 22
      # pinned below; a repo whose lockfile was written by an older major
      # should add a packageManager field rather than edit this, which
      # routes it to the exact path above.
      - name: Set up pnpm (no packageManager pin in this repo)
        if: steps.guard.outputs.open == '0' && steps.pnpm_pin.outputs.pinned == '0'
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        if: steps.guard.outputs.open == '0'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps (so the pipeline's `pnpm build` verify step works)
        if: steps.guard.outputs.open == '0'
        run: |
          pnpm install --frozen-lockfile || {
            s=$?
            echo "::error::pnpm install failed (exit $s). Frequent causes: (1) ERR_PNPM_IGNORED_BUILDS - pnpm 11 hard-fails dependencies with unanswered build scripts (strictDepBuilds is on by default): answer each one in pnpm-workspace.yaml (allowBuilds: dep: true/false, plus an onlyBuiltDependencies list for older pnpm) and commit. (2) pnpm/lockfile version mismatch - align the workflow's pnpm with the version that wrote pnpm-lock.yaml (package.json packageManager field). Reproduce locally with a fresh 'pnpm install --frozen-lockfile'."
            exit $s
          }

      # Codex reads its MCP servers from a config.toml inside its own home
      # directory. Two things here are easy to get wrong and both are silent:
      #
      # 1. The action does NOT honour an inbound CODEX_HOME env var - it takes a
      #    `codex-home` INPUT and sets the env itself. Writing a config to a
      #    hand-rolled $CODEX_HOME and hoping is a no-op, and the failure looks
      #    like an agent with no tools rather than an error.
      # 2. `sandbox: workspace-write` blocks network by default, which kills MCP
      #    over HTTP. The network_access line below is what makes the sandboxed
      #    posture usable at all.
      - name: Write Codex's MCP config
        if: steps.guard.outputs.open == '0' && steps.agent.outputs.agent == 'codex'
        env:
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/codex-home"
          cp .github/mcp-codex.toml "$RUNNER_TEMP/codex-home/config.toml"
          cat >> "$RUNNER_TEMP/codex-home/config.toml" <<'TOML'

          [sandbox_workspace_write]
          network_access = true
          TOML
          # Render the DataForSEO credential tokens. Codex's TOML `env` map is
          # LITERAL - it does not expand ${VAR} the way Claude expands its JSON
          # config - so left alone the dataforseo server would authenticate as
          # the literal string "${DATAFORSEO_LOGIN}" and every keyword call
          # would 401 mid-build. python3 rather than sed so no credential
          # character can break the substitution; values are TOML-escaped. A
          # truncated config (free-mode project, no dataforseo section) makes
          # this a no-op.
          python3 - "$RUNNER_TEMP/codex-home/config.toml" <<'PY'
          import os, sys
          path = sys.argv[1]
          text = open(path).read()
          for token, var in (("${DATAFORSEO_LOGIN}", "DATAFORSEO_LOGIN"),
                             ("${DATAFORSEO_PASSWORD}", "DATAFORSEO_PASSWORD")):
              val = os.environ.get(var, "").replace("\\", "\\\\").replace('"', '\\"')
              text = text.replace(token, val)
          open(path, "w").write(text)
          PY
          echo "Codex home prepared. Servers configured:"
          grep -E '^\[mcp_servers\.' "$RUNNER_TEMP/codex-home/config.toml"

      - name: Run the SEO builder
        if: steps.guard.outputs.open == '0' && steps.agent.outputs.agent == 'claude'
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          # Cloud fires this as the DispatchSEO GitHub App (a Bot actor), and the App also authored the workflow commits, so scheduled runs are bot-actored too. Every trigger here needs repo write access, so allowing bots is safe; without this claude-code-action aborts with "non-human actor".
          allowed_bots: "*"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Pass the standard workflow token as an input so the action uses it
          # directly instead of exchanging OIDC for a Claude GitHub App token
          # (which would require installing the app on the repo).
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: "FIRST call the seo-manager MCP tool get_instructions with workflow build-guide, then follow the returned markdown exactly - it is the current playbook and overrides any cached knowledge of this pipeline. Also read .dispatchseo/conventions.md for this repo's site facts. In brief: take the oldest approved guide suggestion, mark it in_progress, build the guide MDX through the full pipeline (template, thin-content gate, draft, mandatory visuals, humanizer), run pnpm build to verify, open a PR labeled seo via gh, then update_suggestion to done with the PR url and log_page, and state the instructions version in the run report. Never build tool suggestions - those belong to the seo-build-tool workflow. If get_instructions is unavailable, fail loudly and exit without changes; if there are no approved guide suggestions, exit cleanly without any changes."
          claude_args: |
            --mcp-config ./.github/mcp-ci.json
            --permission-mode bypassPermissions
            --max-turns 150
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SEO_MCP_API_KEY: ${{ secrets.SEO_MCP_API_KEY }}
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MCP_TIMEOUT: "120000"
          # Placeholder public env so `next build` never trips on missing vars -
          # static blog pages do not call Supabase, and the clients are lazy.
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"
          NEXT_PUBLIC_SITE_URL: "https://dispatchseo.com"

      # The Codex twin. Same prompt, verbatim - the agent's behaviour must not
      # depend on which one is holding the playbook, and the playbook itself
      # arrives from get_instructions either way.
      #
      # Model: gpt-5 by default, overridable with a repo variable because model
      # availability is per-account, not universal - `gpt-5-codex` 404s on a
      # pay-as-you-go project key even though it appears in GET /v1/models. Set
      # SEO_CODEX_MODEL in the repo's Actions variables to change it without
      # touching this file.
      #
      # There is NO turn budget to set. Codex has no --max-turns equivalent and
      # OpenAI closed the request for one as not-planned, so the job's
      # timeout-minutes above is the only ceiling on a runaway run.
      - name: Run the SEO builder (Codex)
        if: steps.guard.outputs.open == '0' && steps.agent.outputs.agent == 'codex'
        id: codex
        continue-on-error: true
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          # Same rule as the Claude twin's allowed_bots above: cloud fires this
          # as the DispatchSEO GitHub App (a Bot actor) and scheduled runs are
          # bot-actored too, because the App authored the workflow commits.
          # codex-action's actor gate rejects EVERY bot by default (a bot 404s
          # the collaborator-permission lookup), so without this line each
          # unattended Codex run dies before Codex is even installed - while a
          # manual workflow_dispatch passes, which is what hides the failure.
          # Every trigger that can reach this step already required repo write
          # access, so allowing all actors adds nothing an attacker can use.
          allow-users: "*"
          model: ${{ vars.SEO_CODEX_MODEL || 'gpt-5' }}
          codex-home: ${{ runner.temp }}/codex-home
          sandbox: workspace-write
          # Strips sudo from the runner user for the rest of the job. Safe here:
          # everything after this step is curl. It is also more than the Claude
          # half of this pipeline does, which runs with bypassPermissions and no
          # sandbox at all.
          safety-strategy: drop-sudo
          output-file: ${{ runner.temp }}/codex-out.txt
          prompt: "ENVIRONMENT RULE (read first, it overrides habit): you have no apply_patch tool here - only the shell, and you are running UNATTENDED, so there is nobody to answer a question. Write every file with a SINGLE-QUOTED heredoc (cat > path <<'DSEOF' ... DSEOF) or with python3 reading the content from stdin. The quoted delimiter is the whole point: bash expands NOTHING inside it, so the backticks and $ in MDX and TSX survive verbatim. NEVER use an unquoted heredoc, printf or echo to write file content - an unquoted heredoc is what expands backticks and corrupts the file. Pick a delimiter that cannot appear in the content. Verify every write with ls -l and head before moving on, and never let a filename come from an unset shell variable. If you ever find yourself about to ask for approval or a go/no-go, do not: pick the safest option that still completes the task, do it, and say what you chose in the final report. A run that stops to ask a question builds nothing and is a failed run. FIRST call the seo-manager MCP tool get_instructions with workflow build-guide, then follow the returned markdown exactly - it is the current playbook and overrides any cached knowledge of this pipeline. Also read .dispatchseo/conventions.md for this repo's site facts. In brief: take the oldest approved guide suggestion, mark it in_progress, build the guide MDX through the full pipeline (template, thin-content gate, draft, mandatory visuals, humanizer), run pnpm build to verify, open a PR labeled seo via gh, then update_suggestion to done with the PR url and log_page, and state the instructions version in the run report. Never build tool suggestions - those belong to the seo-build-tool workflow. If get_instructions is unavailable, fail loudly and exit without changes; if there are no approved guide suggestions, exit cleanly without any changes."
        env:
          SEO_MCP_API_KEY: ${{ secrets.SEO_MCP_API_KEY }}
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"
          NEXT_PUBLIC_SITE_URL: "https://dispatchseo.com"

      # The action hides Claude's transcript (these logs can be public), which
      # also hides the API error when a run dies on its first call - a dead
      # token shows only "is_error:true" with no way to tell a revoked token
      # Turn-by-turn detail for tuning the pipeline. The dashboard only ever
      # receives the aggregate outcome, which cannot answer the question that
      # actually matters for cost - WHICH pipeline steps burn the turns. This
      # step is what makes that measurable, since the agent run is ~98% of this
      # job's billed wall clock and wall clock is turns x per-turn latency.
      #
      # PRIVATE REPOS ONLY, and that condition is the point rather than
      # caution. Artifacts on a public repository are downloadable by anyone,
      # and this file is the agent's execution log - which is exactly why the
      # classify step below reads it instead of printing it ("these logs can be
      # public"). Publishing it as an artifact would undo that decision for the
      # public repos we specifically recommend to people avoiding Actions
      # charges. Short retention because this is a debugging aid, not a record.
      - name: Save the agent execution log for turn analysis
        if: always() && steps.guard.outputs.open == '0' && github.event.repository.private
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: agent-execution-log-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/claude-execution-output.json
            ${{ runner.temp }}/codex-out.txt
          retention-days: 7
          if-no-files-found: ignore

      # from a usage limit. continue-on-error above keeps this step reachable
      # either way; read the final result/error message from the execution log
      # the action saves and decide what the run MEANS: a genuine usage-limit
      # hit is not a pipeline failure, it is deferred (the dashboard keeps the
      # job due and re-dispatches within hours) and reported as a GREEN run.
      # Anything else is reported red with the real reason. GitHub's secret
      # masking still applies to whatever prints.
      - name: Classify the outcome
        id: classify
        if: steps.guard.outputs.open == '0'
        env:
          SEO_MCP_API_KEY: ${{ secrets.SEO_MCP_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT: ${{ steps.agent.outputs.agent }}
          AGENT_OUTCOME: ${{ steps.agent.outputs.agent == 'codex' && steps.codex.outcome || steps.claude.outcome }}
          CODEX_MSG: ${{ steps.codex.outputs.final-message }}
        run: |
          # Pull whatever the agent left behind. Claude hides its transcript
          # (these logs can be public) and writes an execution log; Codex hands
          # back a single final message.
          msg=""
          if [ "$AGENT" = "codex" ]; then
            msg="$CODEX_MSG"
            [ -n "$msg" ] || msg=$(cat "$RUNNER_TEMP/codex-out.txt" 2>/dev/null)
          else
            f="$RUNNER_TEMP/claude-execution-output.json"
            if [ -f "$f" ]; then
              msg=$(jq -r 'if type=="array" then .[] else . end
                           | select(.type? == "result")
                           | (.result // .error // empty)' "$f" 2>/dev/null | tail -1)
            fi
          fi

          # A deferral is reported as `deferred`, NOT as ok. The difference
          # decides whether this guide gets built today at all: the dashboard
          # works out what is due by reading these reports, and an `ok` row is a
          # COMPLETED run - it would start the full daily window over and
          # suppress the retry, so an evening usage limit would silently cost a
          # day while the dashboard showed green. `deferred` says "ran, built
          # nothing", which keeps the job due and gets it re-dispatched within
          # hours.
          defer() {
            echo "::notice::$1"
            # Marks the outcome as already-reported. The defer exits 0, so
            # without this flag the report step two steps down sees every
            # outcome green and posts ok=1 seconds after this deferred row -
            # and the LATEST row is what the dashboard's due-ness math reads,
            # so the ok would reset the full cadence window and suppress the
            # very retry this deferral exists to preserve.
            echo "reported=1" >> "$GITHUB_OUTPUT"
            curl -sG --max-time 30 -H "Authorization: Bearer $SEO_MCP_API_KEY" \
              --data-urlencode "job=seo-daily" --data-urlencode "deferred=$1" \
              "https://dispatchseo.com/api/cron/deploy-check" || true
            exit 0
          }
          fail() {
            echo "::error::SEO builder failed: $1 - check the run log above for details, or re-run the setup command from your DispatchSEO dashboard if this looks like an auth problem."
            curl -sG --max-time 30 -H "Authorization: Bearer $SEO_MCP_API_KEY" \
              --data-urlencode "job=seo-daily" \
              --data-urlencode "fail=$1" \
              "https://dispatchseo.com/api/cron/deploy-check" || true
            exit 1
          }

          # SUCCESS has to be SHOWN, not asserted. The guard above proved there
          # were zero open SEO PRs when this run started, so a completed build
          # leaves exactly one behind. Without this, an agent that exits 0
          # having built nothing reports ok, which resets the 20h cadence
          # window and costs the day silently - the exact shape seen on
          # 2026-07-31, when Codex hit a file-writing wall, stopped to ask a
          # human for a go/no-go, and exited clean. There is no human on a
          # scheduled runner. The in-stack docker builder has had this check
          # since the same day; this is its twin, and its absence here is why
          # the Actions half stayed silent.
          #
          # Reported as `deferred`, never `fail`: a clean no-PR exit is also
          # what the thin-content and sameness gates do when they reject an
          # idea, and that is correct behaviour rather than breakage. Deferred
          # keeps the job due so the next dispatch picks up the next
          # suggestion, and only goes stale and alarms if runs keep producing
          # nothing.
          if [ "$AGENT_OUTCOME" = "success" ]; then
            built=$(gh pr list --repo "$GITHUB_REPOSITORY" --label seo --state open --json number --jq 'length' 2>/dev/null || echo "?")
            if [ "$built" = "0" ]; then
              defer "The builder finished but opened no PR, so nothing was built this run. The job stays due and gets retried. If this repeats, read the run log above - an agent that stops to ask a question builds nothing, and an unattended run has nobody to answer it."
            fi
            exit 0
          fi

          if [ "$AGENT" = "claude" ]; then
            # A subscription usage limit is a deferral, not a failure: the
            # 12:00/19:00 attempts pick it up.
            if echo "$msg" | grep -qiE 'usage limit|limit reached|rate.?limit'; then
              defer "Claude hit a usage limit this run - the dashboard keeps this build due and re-dispatches it within a few hours. Not a failure."
            fi
            reason="workflow failed (no error detail captured)"
            [ -n "$msg" ] && reason="$msg"
            fail "$reason"
          fi

          # --- Codex ---
          #
          # Do NOT decide this from the text. Codex collapses every 429 into one
          # message - "exceeded retry limit, last status: 429 Too Many Requests"
          # - so grepping it the way the Claude branch above greps its
          # transcript would read an unfunded, permanently dead account as a
          # quiet deferral. The builder would then report green every night
          # while building nothing, which is the single failure mode this
          # pipeline is least able to afford.
          #
          # So on anything 429-shaped, ask OpenAI directly and branch on
          # error.code, which is authoritative and unaffected by wording
          # changes. One tiny metered call, fractions of a cent.
          if ! echo "$msg" | grep -qiE '429|too many requests|exceeded retry limit|usage limit|rate.?limit'; then
            reason="workflow failed (no error detail captured - an empty message usually means the job hit its time limit)"
            [ -n "$msg" ] && reason=$(printf '%s' "$msg" | tail -c 400)
            fail "$reason"
          fi

          probe=$(curl -s --max-time 30 -o /tmp/probe.json -w "%{http_code}" https://api.openai.com/v1/responses \
            -H "Authorization: Bearer $OPENAI_API_KEY" -H "Content-Type: application/json" \
            -d '{"model":"gpt-5-mini","input":"ok","max_output_tokens":16}') || probe=000
          err=$(jq -r '.error.code // empty' /tmp/probe.json 2>/dev/null)
          case "$probe:$err" in
            2*:*)
              # The key works now, so whatever 429 hit mid-run has cleared.
              defer "Codex hit a transient rate limit this run - the key tests healthy now, so the dashboard keeps this build due and re-dispatches it within a few hours. Not a failure." ;;
            429:rate_limit_exceeded)
              defer "Codex is rate-limited right now - the dashboard keeps this build due and re-dispatches it within a few hours. Not a failure." ;;
            429:*|402:*)
              # Every other 429 is a billing state: credit_balance_exhausted,
              # insufficient_quota, or an org/project spend or usage cap. None
              # of them clear by waiting, so none of them may report green.
              fail "your OpenAI account cannot run builds right now (OpenAI said: ${err:-quota exceeded}). This does not fix itself by retrying - add credit or raise the limit at platform.openai.com/settings/organization/billing, then re-run this workflow." ;;
            401:*|403:*)
              fail "OpenAI rejected the OPENAI_API_KEY secret on this repo (HTTP $probe). The key was probably revoked or rotated - create a new one at platform.openai.com/api-keys and set it again with 'gh secret set OPENAI_API_KEY'." ;;
            *)
              fail "Codex failed and OpenAI could not be reached to find out why (probe HTTP $probe). Last message: $(printf '%s' "$msg" | tail -c 300)" ;;
          esac

      # Phone the outcome home: failures land on the DispatchSEO dashboard
      # banner + alert email (same rails as the crons); successes clear any
      # earlier red banner row for this job. Guarded to skip whenever Classify
      # the outcome already reported seo-daily itself (real Claude failure) -
      # this is the fallback for guard-step/preflight-level failures and for
      # the ordinary "Claude succeeded, nothing to build" green path, which
      # Classify deliberately leaves unreported.
      - name: Report outcome to the dashboard
        # Owns reporting ONLY for the plain-success path: the classify step
        # already reports real failures (its own step fails, excluded by
        # outcome) and deferrals (which exit 0 - the reported flag is the only
        # trace, and without checking it this step would overwrite the
        # deferred row with ok=1 and silently cost the day).
        if: always() && steps.classify.outputs.reported != '1' && steps.classify.outcome != 'failure' && steps.claude.outcome != 'failure' && steps.codex.outcome != 'failure'
        env:
          SEO_MCP_API_KEY: ${{ secrets.SEO_MCP_API_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTCOME: ${{ job.status }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            curl -sG --max-time 30 -H "Authorization: Bearer $SEO_MCP_API_KEY" \
              --data-urlencode "job=seo-daily" --data-urlencode "ok=1" \
              "https://dispatchseo.com/api/cron/deploy-check" || true
          else
            curl -sG --max-time 30 -H "Authorization: Bearer $SEO_MCP_API_KEY" \
              --data-urlencode "job=seo-daily" \
              --data-urlencode "fail=workflow failed - $RUN_URL" \
              "https://dispatchseo.com/api/cron/deploy-check" || true
          fi
