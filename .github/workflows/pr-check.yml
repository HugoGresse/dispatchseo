# The check every pull request must pass. `pnpm build` runs tsc via
# `next build`, so this is the typecheck as well as the build - CONTRIBUTING
# tells contributors to run it before pushing, and this is what makes that
# more than an honour system. Nothing here needs a secret: the build only
# wants the NEXT_PUBLIC_* vars, and placeholders satisfy them (static pages
# never call Supabase and the clients are lazy), so the job runs safely on
# pull requests from forks.
name: pr-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A second push to the same PR cancels the first - no point burning minutes
# on a build whose commit is already superseded.
concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        # No version input on purpose: pnpm/action-setup reads the exact pin
        # from package.json's packageManager field, so CI always runs the same
        # pnpm as dev machines. (A version input alongside packageManager
        # hard-errors on any mismatch - plain string compare.)
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # `pnpm build` regenerates the pack itself, which would mask a stale
      # commit - so assert freshness BEFORE the build rewrites it. Editing a
      # file under templates/pipeline/ without committing the regenerated
      # JSON means new installs keep getting the old shim.
      - name: pipeline-pack.json is regenerated (not stale)
        run: |
          node scripts/generate-pipeline-pack.mjs --check || {
            echo "::error::src/lib/pipeline-pack.json is stale - run 'node scripts/generate-pipeline-pack.mjs' and commit it alongside the template edit"
            exit 1
          }

      # What we ship into other people's repos must not be able to fail
      # UNSAFELY. The pack once told the installer to delete a line by hand and
      # hard-failed at setup when that was missed, killing the builder on every
      # run in every repo with a packageManager pin - before the step that
      # reports failures, so it died quietly too. This lints for that class:
      # install-time edits whose omission is fatal, and the pnpm version shape
      # specifically. Credential-free, like the gates around it.
      - name: Pipeline pack cannot fail unsafely
        run: |
          node scripts/pipeline-pack-lint.mjs || {
            echo "::error::pipeline-pack-lint failed - a shipped workflow has a shape that breaks installed repos. See the rule output above."
            exit 1
          }

      # The Claude regression guard. Routing hardcoded Claude strings through
      # the agent registry must not change a single byte an owner pastes into a
      # terminal - these commands carry detail that took real installs to find
      # (--scope local, argument order, the Windows ?key= form). Credential-free
      # and network-free on purpose, so it runs on fork PRs like the build does.
      - name: Agent commands match the golden snapshot
        run: |
          node --experimental-strip-types --no-warnings scripts/agent-golden.mjs --check || {
            echo "::error::Agent command output changed. If intended, run 'node --experimental-strip-types scripts/agent-golden.mjs' and commit the snapshot in the same commit."
            exit 1
          }

      # The CLI is the agent-portable door - the one surface that works in any
      # agent that can run a shell. It has no dependencies and no build step, so
      # the only way it breaks is a syntax error or a bad bin path, and both show
      # up here. Credential-free: --help never touches the network.
      - name: CLI loads and self-documents
        run: |
          node cli/dispatchseo.mjs --help > /dev/null || {
            echo "::error::cli/dispatchseo.mjs failed to run - check it for syntax errors"
            exit 1
          }
          node -e "
            const p = require('./cli/package.json');
            const fs = require('fs');
            if (!fs.existsSync(p.bin.dispatchseo.replace('./', './cli/'))) {
              console.error('::error::cli/package.json bin path does not resolve');
              process.exit(1);
            }
          "

      - name: Build (typecheck)
        run: pnpm build
        env:
          # Placeholder public env so `next build` never trips on missing vars.
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"
          NEXT_PUBLIC_SITE_URL: "https://dispatchseo.com"

  # Proof that the toolchain setup we ship BOOTS - in both repo shapes it can
  # land in. The 2026-07-30 outage was not a logic bug anyone could review their
  # way out of: pnpm/action-setup rejects a version input next to a
  # packageManager pin, and nothing here had ever executed those steps, so the
  # first run of the shipped setup path was on customers' 05:13 schedules.
  #
  # This runs the two blessed shapes against fixture package.json files - one
  # pinned, one not - and proves pnpm ends up installed either way. It is a
  # replica of the shipped steps rather than the pack file itself (GitHub cannot
  # execute a workflow from a JSON blob), and pipeline-pack-lint.mjs is what
  # ties the pack to these two shapes: the lint says the pack may only use them,
  # this job proves they work. Neither is sufficient alone.
  #
  # Credential-free, so it runs on fork PRs like the build job.
  pnpm-setup-shapes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shape: [pinned, unpinned]
    steps:
      - uses: actions/checkout@v4

      # Written outside the repo root on purpose: this repo's own package.json
      # carries a pin, and the action defaults to reading that one - which would
      # make the "unpinned" case silently test the pinned path.
      - name: Write a fixture package.json of this shape
        env:
          SHAPE: ${{ matrix.shape }}
        run: |
          set -euo pipefail
          mkdir -p fixture
          if [ "$SHAPE" = "pinned" ]; then
            printf '{ "name": "fixture", "packageManager": "pnpm@11.5.2" }\n' > fixture/package.json
          else
            printf '{ "name": "fixture" }\n' > fixture/package.json
          fi
          cat fixture/package.json

      # Byte-for-byte the detection the shipped workflows run.
      - name: Detect the pin exactly as the shipped workflows do
        id: pnpm_pin
        run: |
          set -euo pipefail
          cd fixture
          pinned=0
          if [ -f package.json ] && node -e 'process.exit(require("./package.json").packageManager ? 0 : 1)' 2>/dev/null; then
            pinned=1
          fi
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          echo "packageManager pin in package.json: $pinned"

      - name: Detection agrees with the fixture
        env:
          SHAPE: ${{ matrix.shape }}
          PINNED: ${{ steps.pnpm_pin.outputs.pinned }}
        run: |
          set -euo pipefail
          expected=0
          [ "$SHAPE" = "pinned" ] && expected=1
          if [ "$PINNED" != "$expected" ]; then
            echo "::error::pin detection returned $PINNED for the $SHAPE fixture (expected $expected) - the detector in the shipped workflows is wrong"
            exit 1
          fi

      - name: Set up pnpm (version from the repo's packageManager pin)
        if: steps.pnpm_pin.outputs.pinned == '1'
        uses: pnpm/action-setup@v4
        with:
          package_json_file: fixture/package.json

      - name: Set up pnpm (no packageManager pin in this repo)
        if: steps.pnpm_pin.outputs.pinned == '0'
        uses: pnpm/action-setup@v4
        with:
          version: 11
          package_json_file: fixture/package.json

      - name: pnpm is actually installed and runnable
        run: |
          set -euo pipefail
          pnpm --version

  # Agent-portability gate for the MCP tool surface. Claude Code is forgiving
  # about tool schemas; OpenAI's function-calling validator (which Codex feeds
  # every MCP tool through) is not, and one rejected schema can drop the WHOLE
  # server - which reads downstream as "the agent saw no tools and exited
  # cleanly", a green run that built nothing.
  #
  # push-only on purpose. This talks to the deployed MCP with a real key, and
  # pull_request builds from forks cannot read secrets - keeping it out of the
  # PR path preserves the property the build job above documents, that every
  # required check runs credential-free for outside contributors. Main is
  # where a merged schema regression would actually matter anyway.
  mcp-schema:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: MCP tool schemas are agent-portable
        env:
          # The script reads MCP_API_KEY (matching .env.local for local runs);
          # this repo's secret carries the pipeline's name, so map it here
          # rather than storing the same key twice under two names.
          MCP_API_KEY: ${{ secrets.SEO_MCP_API_KEY }}
        run: |
          if [ -z "$MCP_API_KEY" ]; then
            echo "::warning::SEO_MCP_API_KEY is not set on this repo - skipping the schema conformance gate."
            exit 0
          fi
          node scripts/mcp-schema-check.mjs https://dispatchseo.com
