name: Star alert

# Emails the owner the moment someone stars the repo. GitHub's own watch
# settings cover issues/PRs/releases/forks but never stars, so the only way
# to hear about them is this: a star fires the `watch` event with type
# "started", and this workflow turns that into a Resend email.
#
# Known limits, both GitHub's, neither fixable here:
# - UNstarring fires no event at all, so the count in these emails only ever
#   goes up. Trust the repo page, not the last email, for the real number.
# - The workflow must exist on the default branch to trigger.
#
# Deliberately NOT reporting to the dashboard banner/cron rails: a star is
# good news, and those rails exist for things that broke.

on:
  watch:
    types: [started]

# No concurrency group on purpose - two people starring seconds apart are two
# separate emails, and cancel-in-progress would silently eat one of them.

permissions: {}

jobs:
  notify:
    # Forks that enable Actions would otherwise email their own owner (or go
    # red on the missing secret) every time someone stars the fork.
    if: github.repository == 'NeoZi12/dispatchseo'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Email the owner
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM || 'DispatchSEO <alerts@clockedcode.com>' }}
          # Via env, never inlined into the script - ${{ }} interpolation of
          # attacker-controlled fields is the classic Actions injection hole,
          # and every field below is set by whoever clicked the star.
          STARGAZER: ${{ github.event.sender.login }}
          STARGAZER_URL: ${{ github.event.sender.html_url }}
          STAR_COUNT: ${{ github.event.repository.stargazers_count }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Skip quietly rather than going red: a missing key is a setup gap,
          # not a failure worth a GitHub notification of its own.
          if [ -z "${RESEND_API_KEY:-}" ] || [ -z "${ALERT_EMAIL:-}" ]; then
            echo "::warning::RESEND_API_KEY or ALERT_EMAIL not set - skipping the email. @$STARGAZER starred ($STAR_COUNT total)."
            exit 0
          fi

          # jq builds the JSON so a login with quotes in it can't break out.
          payload=$(jq -n \
            --arg from "$ALERT_EMAIL_FROM" \
            --arg to "$ALERT_EMAIL" \
            --arg subject "⭐ @$STARGAZER starred $REPO ($STAR_COUNT total)" \
            --arg user "$STARGAZER" \
            --arg url "$STARGAZER_URL" \
            --arg count "$STAR_COUNT" \
            --arg repo "$REPO" \
            '{from: $from, to: [$to],
              subject: $subject,
              html: ("<p><a href=\"" + $url + "\">@" + $user + "</a> just starred <b>" + $repo + "</b>.</p><p>That is <b>" + $count + "</b> stars total.</p><p><a href=\"https://github.com/" + $repo + "/stargazers\">See who else</a></p>")}')

          code=$(curl -s -o /tmp/resend.out -w "%{http_code}" --max-time 30 \
            -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$payload") || code=000

          if [ "$code" != "200" ]; then
            echo "::error::Resend rejected the star email (HTTP $code): $(head -c 200 /tmp/resend.out)"
            exit 1
          fi
          echo "Emailed: @$STARGAZER starred $REPO ($STAR_COUNT total)."
